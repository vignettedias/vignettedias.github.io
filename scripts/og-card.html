<!doctype html>
<!--
  Source for public/og.png — the 1200×630 link-preview card.
  Regenerate by screenshotting this page at exactly 1200×630, for example:
    npx playwright screenshot --viewport-size=1200,630 scripts/og-card.html public/og.png
  Every figure on it also appears on the site.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&family=Space+Grotesk:wght@600;700&family=JetBrains+Mono:wght@400;500&display=block"
      rel="stylesheet"
    />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        background: #050505;
        color: #e9eff5;
        font-family: 'Inter', system-ui, sans-serif;
      }
      .card {
        position: relative;
        width: 1200px;
        height: 630px;
        padding: 72px 80px;
        display: flex;
        flex-direction: column;
        background:
          radial-gradient(ellipse 60% 70% at 85% 10%, rgba(58, 231, 255, 0.16), transparent 70%),
          radial-gradient(ellipse 50% 60% at 100% 100%, rgba(155, 123, 255, 0.14), transparent 70%),
          #050505;
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(to right, rgba(120, 145, 170, 0.07) 1px, transparent 1px),
          linear-gradient(to bottom, rgba(120, 145, 170, 0.07) 1px, transparent 1px);
        background-size: 60px 60px;
        mask-image: radial-gradient(ellipse 90% 90% at 70% 30%, #000 20%, transparent 80%);
      }
      .frame {
        position: absolute;
        inset: 28px;
        border: 1px solid #1a1f26;
      }
      .frame::before,
      .frame::after {
        content: '';
        position: absolute;
        width: 18px;
        height: 18px;
        border-color: #3ae7ff;
      }
      .frame::before {
        top: -1px;
        left: -1px;
        border-top: 2px solid;
        border-left: 2px solid;
      }
      .frame::after {
        bottom: -1px;
        right: -1px;
        border-bottom: 2px solid;
        border-right: 2px solid;
      }
      .eyebrow {
        position: relative;
        font-family: 'JetBrains Mono', monospace;
        font-size: 18px;
        letter-spacing: 0.22em;
        text-transform: uppercase;
        color: #3ae7ff;
        display: flex;
        align-items: center;
        gap: 16px;
      }
      .eyebrow::before {
        content: '';
        width: 40px;
        height: 2px;
        background: #3ae7ff;
      }
      h1 {
        position: relative;
        margin-top: 26px;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 700;
        font-size: 128px;
        line-height: 0.92;
        letter-spacing: -0.035em;
      }
      h1 span {
        background: linear-gradient(95deg, #3ae7ff 10%, #9b7bff 90%);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      .disciplines {
        position: relative;
        margin-top: 30px;
        font-family: 'Space Grotesk', sans-serif;
        font-weight: 600;
        font-size: 30px;
        color: #aab6c3;
        letter-spacing: -0.01em;
      }
      .disciplines b {
        color: #262d36;
        font-weight: 600;
        margin: 0 14px;
      }
      .foot {
        position: relative;
        margin-top: auto;
        display: flex;
        align-items: flex-end;
        justify-content: space-between;
      }
      .chips {
        display: flex;
        gap: 12px;
      }
      .chip {
        font-family: 'JetBrains Mono', monospace;
        font-size: 17px;
        color: #aab6c3;
        border: 1px solid #262d36;
        background: rgba(11, 13, 16, 0.8);
        padding: 10px 16px;
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .dot {
        width: 9px;
        height: 9px;
        border-radius: 50%;
      }
      .url {
        font-family: 'JetBrains Mono', monospace;
        font-size: 19px;
        color: #78848f;
        letter-spacing: 0.04em;
      }
      .url em {
        font-style: normal;
        color: #e9eff5;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="grid"></div>
      <div class="frame"></div>
      <div class="eyebrow">B.Tech Cyber Security · VIT Vellore</div>
      <h1>Vighnesh <span>Das</span></h1>
      <p class="disciplines">Cyber Security<b>×</b>AI / ML<b>×</b>Software Engineering</p>
      <div class="foot">
        <div class="chips">
          <span class="chip"><span class="dot" style="background: #3ae7ff"></span>2 published patents</span>
          <span class="chip"><span class="dot" style="background: #5df2a8"></span>X3DH + Double Ratchet</span>
          <span class="chip"><span class="dot" style="background: #9b7bff"></span>Forensic AI</span>
        </div>
        <span class="url"><em>vignettedias</em>.github.io</span>
      </div>
    </div>
  </body>
</html>
